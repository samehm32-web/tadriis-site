<style>
:root{--font:'Readex Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Unbounded','Readex Pro',system-ui,sans-serif;--glyph:'Reem Kufi','Readex Pro',sans-serif}
html[data-theme="dark"]{
  --bg:#131418;--text:#F6F4EE;--soft:#D8D6D0;--muted:#A9A9AF;--line:rgba(246,244,238,.16);--panel:rgba(19,20,24,.84);--panel-b:rgba(246,244,238,.26);
  --hi:rgba(246,244,238,.07);--btn:#22C3A6;--on:#131418;--field:rgba(246,244,238,.06);--track:rgba(246,244,238,.18);--mesh:rgba(74,125,255,.22);--blob-a:.5;--blend:screen;--deco:1;--glow:1;
  --mint-rgb:127,230,216;--logo-ar:#22C3A6;
  --ar:#4A7DFF;--ar-rgb:74,125,255;--ar-btn:#4A7DFF;--ar-on:#131418;
  --qu:#22C3A6;--qu-rgb:34,195,166;--qu-btn:#22C3A6;--qu-on:#131418;
  --ma:#FF3B5C;--ma-rgb:255,59,92;--ma-btn:#FF6B85;--ma-on:#131418;
  color-scheme:dark}
html[data-theme="light"]{
  --bg:#F6F4EE;--text:#131418;--soft:#3A3C44;--muted:#5A5C66;--line:rgba(19,20,24,.18);--panel:rgba(255,255,255,.8);--panel-b:rgba(19,20,24,.26);
  --hi:rgba(19,20,24,.05);--btn:#22C3A6;--on:#131418;--field:rgba(19,20,24,.05);--track:rgba(19,20,24,.16);--mesh:rgba(74,125,255,.18);--blob-a:.3;--blend:normal;--deco:.4;--glow:0;
  --mint-rgb:127,230,216;--logo-ar:#13A78C;
  --ar:#2F5BE0;--ar-rgb:74,125,255;--ar-btn:#4A7DFF;--ar-on:#131418;
  --qu:#087562;--qu-rgb:34,195,166;--qu-btn:#22C3A6;--qu-on:#131418;
  --ma:#D4153F;--ma-rgb:255,59,92;--ma-btn:#FF6B85;--ma-on:#131418;
  color-scheme:light}
html[data-theme="dark"][data-sj="ma"]{--bg:#1B1114}
html[data-theme="dark"][data-sj="qu"]{--bg:#0F1B1A}
[data-k="ar"]{--c:var(--ar);--rgb:var(--ar-rgb);--bc:var(--ar-btn);--oc:var(--ar-on)}
[data-k="qu"]{--c:var(--qu);--rgb:var(--qu-rgb);--bc:var(--qu-btn);--oc:var(--qu-on)}
[data-k="ma"]{--c:var(--ma);--rgb:var(--ma-rgb);--bc:var(--ma-btn);--oc:var(--ma-on)}
[data-k="all"]{--c:var(--text);--rgb:74,125,255;--bc:var(--btn);--oc:var(--on)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.no-intro,html:has(body.no-intro){transition:background-color .35s ease}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c,#4A7DFF);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.disp{font-family:var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
[dir="rtl"] .disp{letter-spacing:0}

/* Stage: background world, changes with the subject */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;filter:blur(30px);mix-blend-mode:var(--blend);animation:blobA 24s ease-in-out infinite alternate}
.blob.a{left:-12vw;top:-18vw;width:58vw;height:58vw;background:radial-gradient(circle at 35% 35%,rgba(var(--ar-rgb),var(--blob-a)),rgba(var(--ar-rgb),0) 68%)}
.blob.b{right:-14vw;top:-6vw;width:52vw;height:52vw;background:radial-gradient(circle at 35% 35%,rgba(var(--qu-rgb),var(--blob-a)),rgba(var(--qu-rgb),0) 68%);animation-name:blobB;animation-duration:28s}
.blob.c{left:28vw;top:30vw;width:50vw;height:50vw;background:radial-gradient(circle at 35% 35%,rgba(var(--mint-rgb),calc(var(--blob-a)*.7)),rgba(var(--mint-rgb),0) 68%);animation-name:blobC;animation-duration:32s}
@keyframes blobA{0%{transform:translate(0,0) rotate(0);border-radius:42% 58% 63% 37%/41% 44% 56% 59%}50%{transform:translate(8vw,6vh) rotate(40deg);border-radius:58% 42% 38% 62%/55% 38% 62% 45%}100%{transform:translate(-4vw,10vh) rotate(80deg);border-radius:38% 62% 50% 50%/62% 50% 50% 38%}}
@keyframes blobB{0%{transform:translate(0,0) rotate(0);border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{transform:translate(-10vw,8vh) rotate(-50deg);border-radius:40% 60% 70% 30%/40% 50% 60% 50%}100%{transform:translate(-2vw,-6vh) rotate(-90deg);border-radius:55% 45% 45% 55%/45% 60% 40% 55%}}
@keyframes blobC{0%{transform:translate(0,0) rotate(0);border-radius:50% 50% 40% 60%/40% 60% 50% 50%}50%{transform:translate(12vw,-8vh) rotate(60deg);border-radius:65% 35% 55% 45%/50% 40% 60% 50%}100%{transform:translate(-8vw,-4vh) rotate(110deg);border-radius:40% 60% 60% 40%/60% 45% 55% 40%}}
.mesh{position:absolute;left:-30%;right:-30%;bottom:-8%;height:58%;transform:perspective(700px) rotateX(64deg);transform-origin:50% 100%;
  background-image:linear-gradient(var(--mesh) 1px,transparent 1px),linear-gradient(90deg,var(--mesh) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 45%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.5) 45%,transparent 85%);animation:mesh 5s linear infinite}
@keyframes mesh{to{background-position:0 56px,0 0}}
.stage .deco{position:absolute;inset:0;width:100%;height:100%;opacity:var(--deco)}
.stage .deco *{vector-effect:non-scaling-stroke}
@keyframes draw{from{stroke-dashoffset:3000}to{stroke-dashoffset:0}}
.curve{stroke-dasharray:3000;animation:draw 4.5s ease-out forwards}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,-120px)}}
.tess{position:absolute;inset:-120px;animation:drift 40s linear infinite}

/* Intro */
.intro{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);animation:introOut .55s ease 1.55s forwards}
.intro-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
.intro .intro-word{font-family:var(--display);font-size:clamp(20px,3.4vw,26px);font-weight:500;letter-spacing:-.02em;animation:wordIn .7s ease .75s both}
.intro-icon{width:112px;height:112px;overflow:visible}
.intro-icon .pl{animation:pgL .75s cubic-bezier(.2,.8,.2,1) both}
.intro-icon .pr{animation:pgR .75s cubic-bezier(.2,.8,.2,1) both}
.intro-icon .pm{animation:pgM .5s ease .55s both}
.intro-icon .pd{animation:pgD .55s cubic-bezier(.3,1.4,.5,1) both}
.intro-icon .pd2{animation-delay:.95s}.intro-icon .pd1{animation-delay:.85s}
@keyframes pgL{from{transform:translateX(-46px);opacity:0}to{transform:none;opacity:1}}
@keyframes pgR{from{transform:translateX(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes pgM{from{opacity:0}to{opacity:1}}
@keyframes pgD{from{transform:translateY(-34px);opacity:0}to{transform:none;opacity:1}}
.intro-track{width:180px;height:3px;border-radius:2px;overflow:hidden;background:var(--track)}
.intro-bar{display:block;height:100%;background:linear-gradient(90deg,#4A7DFF,#22C3A6,#7FE6D8);transform-origin:left center;animation:bar 1.15s cubic-bezier(.6,0,.2,1) .25s both}
[dir="rtl"] .intro-bar{transform-origin:right center}
@keyframes introOut{to{opacity:0;visibility:hidden}}
@keyframes markIn{from{opacity:0;transform:scale(.6) rotate(-12deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes wordIn{from{opacity:0;letter-spacing:.3em}to{opacity:1}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:1.55s}.d2{animation-delay:1.7s}.d3{animation-delay:1.82s}.d4{animation-delay:2.4s}
.c0{animation-delay:1.95s}.c1{animation-delay:2.08s}.c2{animation-delay:2.21s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
body.no-intro .rise{animation-delay:0s!important}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes flood{0%{clip-path:circle(0% at var(--fx,50%) var(--fy,60%));opacity:1}60%{clip-path:circle(150% at var(--fx,50%) var(--fy,60%));opacity:1}100%{clip-path:circle(150% at var(--fx,50%) var(--fy,60%));opacity:0}}
.flood{position:fixed;inset:0;z-index:40;pointer-events:none;background:rgba(var(--rgb),.9);animation:flood .8s ease-in forwards}

/* Layout */
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}
.container{width:100%;max-width:1320px;margin:0 auto;padding-inline:32px}
nav.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:22px}
.brand{display:flex;align-items:center;gap:6px;text-decoration:none;flex:none;border-radius:12px}
.brand .lg-icon{height:44px;width:auto;display:block;flex:none;overflow:visible}
.lg-words{overflow:hidden;max-width:96px;opacity:1;transition:max-width .85s cubic-bezier(.65,0,.25,1),opacity .5s ease,transform .85s cubic-bezier(.65,0,.25,1)}
.lg-words{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;direction:ltr;white-space:nowrap}
.w-en{font-family:var(--font);font-weight:600;font-size:21px;line-height:1;letter-spacing:-.01em;color:var(--text)}
.w-ar{font-family:var(--font);font-weight:600;font-size:21px;line-height:1.4;margin-top:-2px;color:var(--logo-ar,#22C3A6);direction:rtl;unicode-bidi:isolate}
[dir="rtl"] .brand{flex-direction:row-reverse}
.brand.min .lg-words{max-width:0;opacity:0;transform:translateX(-10px)}
[dir="rtl"] .brand.min .lg-words{transform:translateX(10px)}
.brand.min:hover .lg-words,.brand.min:focus-visible .lg-words{max-width:96px;opacity:1;transform:none}
.brand:hover .hl{animation:hopL .9s cubic-bezier(.3,.9,.3,1)}
.brand:hover .hr{animation:hopR .9s cubic-bezier(.3,.9,.3,1)}
.brand:hover .hm{animation:hopM .9s ease}
.brand:hover .hd1{animation:hopD .8s cubic-bezier(.3,1.5,.5,1)}
.brand:hover .hd2{animation:hopD .8s cubic-bezier(.3,1.5,.5,1) .09s}
@keyframes hopL{0%,100%{transform:none}35%{transform:translateX(-38px)}}
@keyframes hopR{0%,100%{transform:none}35%{transform:translateX(38px)}}
@keyframes hopM{0%,100%{opacity:1}20%,45%{opacity:0}}
@keyframes hopD{0%,100%{transform:none}40%{transform:translateY(-38px)}}
.foot-brand{display:inline-flex;align-items:center;gap:10px}
.foot-brand svg{width:26px;height:26px;flex:none}
.nav-links{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:15px}
.cur-pick{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;color:var(--soft);font-size:15px;font-weight:600;border-radius:10px;background:none;border:0;cursor:pointer}.cur-pick:hover{color:var(--text);background:rgba(127,127,127,.12)}
.cp-scrim{position:fixed;inset:0;z-index:200;background:rgba(10,11,14,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .18s}.cp-scrim.in{opacity:1}
.cp{width:min(520px,100%);max-height:min(640px,86vh);display:flex;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--panel-b);border-radius:18px;padding:22px 20px 14px;box-shadow:0 30px 80px rgba(0,0,0,.4);transform:translateY(14px) scale(.97);transition:transform .22s cubic-bezier(.2,.8,.2,1)}.cp-scrim.in .cp{transform:none}
.cp-head{display:flex;align-items:center;justify-content:space-between}.cp h2{margin:0;font-size:22px}.cp-x{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--soft);font-size:26px;line-height:1;cursor:pointer}.cp-x:hover{background:rgba(127,127,127,.15)}
.cp-sub{margin:6px 0 14px;color:var(--muted);font-size:14.5px}.cp-q{min-height:46px}
.cp-name{margin:10px 2px 4px;min-height:22px;font-weight:600;font-size:15px}
.cp-list{margin-top:4px;overflow:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;align-content:start;padding:2px}
.cp-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border:1px solid transparent;border-radius:12px;background:none;color:var(--text);cursor:pointer}.cp-tile img{width:48px;height:36px;border-radius:5px;box-shadow:0 0 0 1px rgba(127,127,127,.35);object-fit:cover}.cp-tile b{font-size:12px;color:var(--muted);font-weight:600}
.cp-tile:hover,.cp-tile:focus-visible{background:rgba(127,127,127,.14);outline:0}.cp-tile.on{background:rgba(74,125,255,.16);border-color:#4A7DFF}.cp-tile.on b{color:var(--text)}.cp-none{grid-column:1/-1;padding:18px 12px;color:var(--muted)}
@media(max-width:560px){.cp-scrim{align-items:flex-end;padding:0}.cp{width:100%;max-height:82vh;border-radius:20px 20px 0 0}}
.nav-link{text-decoration:none;padding:10px 12px;color:var(--soft);background:none;border:0;border-radius:8px}
.nav-link:hover{color:var(--text)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:1px solid var(--panel-b);margin-inline:6px}
.signup{background:var(--btn);color:var(--on);text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:600;border:0}
main{flex:1;padding-block:20px 56px;display:flex;flex-direction:column;gap:32px}
footer{border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:20px;font-size:14px;color:var(--muted)}
.foot a{color:var(--muted);text-decoration:none}.foot a:hover{color:var(--text)}
.foot div{display:flex;flex-wrap:wrap;gap:20px}
.foot-legal{font-size:11.5px;line-height:1.5;color:var(--muted);opacity:.55;padding-block:0 22px}.legal .fine{font-size:12.5px;line-height:1.6;color:var(--muted);opacity:.8;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}

/* Buttons and fields. No pills: square-ish controls only. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none;line-height:1}
.btn-primary{background:var(--bc,var(--btn));color:var(--oc,var(--on))}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:var(--panel-b);color:var(--text)}
.btn-ghost:hover{border-color:var(--text)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-lg{min-height:58px;padding:0 36px;font-size:18px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--soft);text-decoration:none;font-size:15px;background:none;border:0;padding:6px 0}
.back:hover{color:var(--text)}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl{font-size:14px;color:var(--soft)}
.input{width:100%;min-height:50px;padding:12px 14px;border-radius:10px;border:1px solid var(--panel-b);background:var(--field);font-size:16px}
.input:hover{border-color:var(--text)}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.input[aria-invalid="true"]{border-color:#FF6B6B}
.err{color:#FF8A8A;font-size:14px}
html[data-theme="light"] .err{color:#B3261E}
.note{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.about{max-width:980px;margin:0 auto;padding:8px 0 70px}.ab-hero{position:relative;padding:30px 0 40px}.ab-word{position:absolute;inset-inline-end:-10px;top:-50px;font-size:min(34vw,300px);line-height:1;font-weight:800;background:linear-gradient(120deg,#4A7DFF,#22C3A6);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.16;pointer-events:none;user-select:none}
.ab-hero h1{position:relative;max-width:12ch;margin-bottom:22px}.ab-hero .lead{position:relative;max-width:56ch;font-size:19px;line-height:1.65;color:var(--soft)}
.ab-three{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--line)}.ab-three section{padding:30px 26px 34px;border-inline-start:1px solid var(--line)}.ab-three section:first-child{border-inline-start:0;padding-inline-start:0}
.ab-three h2{font-size:clamp(34px,5vw,52px);line-height:1;margin:0 0 14px;letter-spacing:-.02em;color:var(--c,#4A7DFF)}.ab-three section[data-k=ar]{--c:#4A7DFF}.ab-three section[data-k=qu]{--c:#22C3A6}.ab-three section[data-k=ma]{--c:#E0A030}
.ab-three p{margin:0;font-size:16px;line-height:1.65;color:var(--soft)}
.ab-h{font-size:22px;margin:54px 0 16px}.ab-why{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 40px;margin:0}.ab-why dt{font-weight:700;margin-bottom:4px}.ab-why dd{margin:0;color:var(--soft);line-height:1.6}
.ab-who{max-width:64ch;line-height:1.7;color:var(--soft);font-size:16.5px}.ab-cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.legal .btn,.about .btn{text-decoration:none}.contact .btn-primary{color:#0b1a17}
.contact .ct-mail{font-size:clamp(24px,4vw,36px);font-weight:700;margin:22px 0 14px}.contact .ct-mail a{text-decoration:none}.contact .ab-why{margin:34px 0 10px}
@media(max-width:760px){.ab-three{grid-template-columns:1fr}.ab-three section{border-inline-start:0;border-top:1px solid var(--line);padding-inline:0}.ab-three section:first-child{border-top:0}.ab-why{grid-template-columns:1fr}}
.legal{max-width:760px;margin:0 auto;padding:12px 0 60px}.legal h2{font-size:20px;margin:34px 0 8px}.legal p{font-size:16px;line-height:1.7;color:var(--soft);margin:0 0 12px}.legal .lead{color:var(--text);font-size:17px}.legal a,.check-row a{color:inherit;text-decoration:underline}
.check-row{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--soft);line-height:1.5;cursor:pointer}
.check-row input,.cb{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--c,#4A7DFF)}

/* Dropdown menu */
.dd{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:0 14px;border-radius:10px;border:1px solid var(--panel-b);background:var(--field);text-align:start;font-size:16px}
.dd-btn:hover{border-color:var(--c,var(--text))}
.dd-btn[aria-expanded="true"]{border-color:var(--c,var(--text));box-shadow:0 0 0 3px rgba(var(--rgb,74,125,255),.25)}
.dd-btn svg{flex:none;transition:transform .2s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-val{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-list{position:absolute;z-index:40;inset-inline:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;max-height:320px;overflow:auto;border-radius:12px;border:1px solid var(--panel-b);background:var(--bg);box-shadow:0 26px 60px -18px rgba(0,0,0,.55);outline:none}
.dd.up .dd-list{top:auto;bottom:calc(100% + 6px)}
.dd-list li{padding:11px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dd-list li.act{background:var(--hi);box-shadow:inset 0 0 0 2px rgba(var(--rgb,74,125,255),.7)}
.dd-list li[aria-selected="true"]{background:rgba(var(--rgb,74,125,255),.2);font-weight:600}
.dd-list.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.dd-list.cols li{justify-content:center}
.dd-list.cols li[data-v=""]{grid-column:1/-1;justify-content:space-between}
.big-dd .dd-btn{min-height:64px;font-size:22px;border-width:0 0 3px 0;border-radius:0;background:transparent;padding-inline:0;border-color:var(--text)}

/* Orbs */
.orb{position:relative;width:var(--s,72px);height:var(--s,72px);border-radius:50%;flex:none;box-shadow:0 0 calc(var(--s,72px)*.55) rgba(var(--rgb,74,125,255),calc(.55*var(--glow)))}
html[data-theme="light"] .orb{box-shadow:0 10px 24px -10px rgba(var(--rgb,74,125,255),.7)}
.orb i{position:absolute;inset:0;border-radius:50%;background:var(--g);animation:spin var(--dur,10s) linear infinite var(--dir,normal)}
.orb b{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.78),rgba(255,255,255,0) 38%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.dot{display:inline-block;width:8px;height:8px;border-radius:1px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 10px rgba(var(--rgb),.9);animation:blink 1.8s infinite;flex:none}

/* Home */
.hero{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
h1.mega{font-family:var(--display);font-size:clamp(36px,5.4vw,62px);line-height:1.05;font-weight:700;letter-spacing:-.035em}
[dir="rtl"] h1.mega{line-height:1.3;letter-spacing:0;font-family:var(--font)}
.sub{margin:0;font-size:19px;color:var(--soft)}
.search-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.search{width:100%;max-width:780px;display:flex;align-items:center;gap:12px;padding-block:8px;padding-inline:18px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--panel-b)}
.search:focus-within{border-color:var(--text)}
.search svg{flex:none;opacity:.7}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:12px 0;outline:none}
.search input::placeholder{color:var(--muted);opacity:1}
.search button{border:0;border-radius:10px;background:var(--btn);color:var(--on);font-weight:600;padding:0 24px;min-height:46px}
.search-msg{margin:0;min-height:22px;font-size:15px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.panel{display:flex;flex-direction:column;gap:20px;padding:26px;border-radius:20px;border:1px solid rgba(var(--rgb),.45);background:linear-gradient(180deg,rgba(var(--rgb),.13),var(--panel) 60%);transition:border-color .2s,box-shadow .3s}
.panel:hover{border-color:var(--c);box-shadow:0 30px 70px -36px rgba(var(--rgb),.8)}
.panel.matched{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
/* Panel art */
.art{position:relative;height:200px;border-radius:12px;overflow:hidden;direction:ltr;display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:100%;display:block;overflow:visible}
.art-ar .wr{position:relative;direction:rtl;font-family:var(--glyph);font-size:118px;line-height:1;white-space:nowrap;padding-inline:6px}
.wr .gh{display:block;color:rgba(var(--rgb),.17)}
.wr .ink{position:absolute;inset:0;padding-inline:6px;color:var(--c);clip-path:inset(-30% -12% -30% 100%);animation:inkw 2.4s cubic-bezier(.55,0,.25,1) var(--wd,.6s) both}
.wr .nib{position:absolute;top:56%;left:100%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--text);transform:rotate(45deg);box-shadow:0 0 12px rgba(var(--rgb),.9);opacity:0;animation:nibw 2.4s cubic-bezier(.55,0,.25,1) var(--wd,.6s) both}
.wr .rl{position:absolute;left:-120px;right:-120px;height:0;border-top:1px solid rgba(var(--rgb),.34)}
.wr .rl1{top:2%;border-top-style:dashed;opacity:.7}.wr .rl2{top:31%;border-top-style:dashed;opacity:.7}.wr .rl3{top:83%}
@keyframes inkw{from{clip-path:inset(-30% -12% -30% 100%)}to{clip-path:inset(-30% -12% -30% -12%)}}
@keyframes nibw{0%{left:100%;opacity:1}90%{opacity:1}100%{left:-12%;opacity:0}}
.rose *{fill:none;stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke}
.rose .core{fill:rgba(var(--rgb),.14)}
.rose .fillp{fill:var(--c);stroke:none}
.rose .rule{stroke-opacity:.45}
.rose .num{fill:var(--c);stroke:none;font-family:var(--glyph);font-size:34px;font-weight:600}
.rose .ro1,.rose .ro2{transform-origin:100px 100px;transition:transform 1.5s cubic-bezier(.2,.8,.2,1)}
.panel:hover .rose .ro1{transform:rotate(9deg)}.panel:hover .rose .ro2{transform:rotate(-9deg)}
.rose-big{position:absolute;inset-inline-end:-6vw;top:-4vw;width:min(62vw,640px);height:auto;opacity:.42;pointer-events:none}
.art-ma .ax{fill:none;stroke:rgba(var(--rgb),.45);stroke-width:1.2}
.art-ma .tk{stroke-width:1}
.art-ma .cv{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art-ma .drop{fill:none;stroke:rgba(var(--rgb),.6);stroke-width:1;stroke-dasharray:3 4}
.art-ma .tan{fill:none;stroke:var(--text);stroke-width:1.6;stroke-linecap:round}
.art-ma .fillp{fill:var(--c)}
.art-ma .pt{fill:var(--c)}
.art-ma .pr{fill:none;stroke:var(--c);stroke-opacity:.5;stroke-width:1.2}
.art-ma .ro{position:absolute;top:8px;inset-inline-start:12px;left:12px;font-family:var(--display);font-size:12px;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:0}
.panel h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
[dir="rtl"] .panel h2{font-family:var(--font);letter-spacing:0}
.desc{margin:6px 0 0;color:var(--soft);font-size:16px;line-height:1.5}
.online{margin:10px 0 0;display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--c)}
.pv{display:flex;flex-direction:column}
.pv a{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.pv a:hover .tn{text-decoration:underline}
.pv .tn{font-weight:600;font-size:15.5px}
.pv .ta{font-size:13.5px;color:var(--muted)}
.pv .tp{margin-inline-start:auto;font-family:var(--display);font-size:13.5px;white-space:nowrap}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;font-size:15px;color:var(--soft)}
.trust li{display:flex;align-items:center;gap:10px}
.trust i{display:block;width:7px;height:7px;transform:rotate(45deg)}

/* Results */
.results{display:grid;grid-template-columns:290px minmax(0,1fr);gap:48px;align-items:start}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:22px;padding:22px;border-radius:16px;border:1px solid var(--panel-b);background:var(--panel)}
.side h2{font-family:var(--display);font-size:17px;font-weight:500}
[dir="rtl"] .side h2{font-family:var(--font)}
.res-title{display:flex;flex-direction:column;gap:14px;margin-bottom:10px}
h1.mega2{font-family:var(--display);font-size:clamp(44px,7vw,96px);line-height:.98;font-weight:700;letter-spacing:-.04em;overflow-wrap:anywhere}
[dir="rtl"] h1.mega2{font-family:var(--font);letter-spacing:0;line-height:1.2}
.lead{margin:0;font-size:19px;color:var(--soft);line-height:1.5}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) 230px 160px 110px;gap:20px;align-items:center;padding:20px 8px;border-top:1px solid var(--line);text-decoration:none;color:inherit;border-radius:6px;transition:background .2s}
.trow:last-child{border-bottom:1px solid var(--line)}
.trow:hover{background:var(--hi)}
.trow:hover .orb{transform:scale(1.06)}
.orb{transition:transform .25s}
.t-name{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.02em}
[dir="rtl"] .t-name{font-family:var(--font);font-weight:600}
.t-head{margin:6px 0 0;font-size:15.5px;color:var(--soft);line-height:1.45}
.t-meta{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px}
.bars span{width:8px;border-radius:2px;background:var(--track);height:8px}
.bars span.on{background:var(--c);box-shadow:0 0 10px rgba(var(--rgb),calc(.7*var(--glow)))}
.t-av{font-size:13px;color:var(--muted);margin-top:8px;display:block}
.t-price{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.t-price small{display:block;font-family:var(--font);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
.t-next{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;color:var(--c)}
.open{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;background:var(--bc,var(--btn));color:var(--oc,var(--on));font-weight:600;font-size:15px}
.empty{padding:40px 0;color:var(--soft);font-size:18px}

/* Profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:56px;align-items:start}
.prof-main{display:flex;flex-direction:column;gap:34px}
.prof-hero{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
h1.name{font-family:var(--display);font-size:clamp(38px,5.4vw,62px);line-height:1.02;font-weight:700;letter-spacing:-.04em}
[dir="rtl"] h1.name{font-family:var(--font);letter-spacing:0;line-height:1.2}
.verif{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.verif li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15.5px}
.verif li svg{color:var(--c);flex:none}
.sec h2{font-family:var(--display);font-size:20px;font-weight:500;margin-bottom:14px}
[dir="rtl"] .sec h2{font-family:var(--font);font-weight:600}
.sec p{margin:0;font-size:17px;line-height:1.65;color:var(--soft);max-width:62ch}
.rows{display:flex;flex-direction:column}
.rows>div{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-top:1px solid var(--line);font-size:16px}
.rows>div:last-child{border-bottom:1px solid var(--line)}
.rows>div span:first-child{color:var(--muted)}
.rows>div.cur{background:rgba(var(--rgb),.14);box-shadow:inset 3px 0 0 var(--c);padding-inline:14px}
.rows .p{font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums}
.book{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;padding:26px;border-radius:20px;border:1px solid var(--panel-b);background:var(--panel)}
.book h2{font-family:var(--display);font-size:22px;font-weight:500}
[dir="rtl"] .book h2{font-family:var(--font);font-weight:600}
.sched{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.sched .dh{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.35}
.sched .dh b{display:block;font-size:16px;color:var(--text);font-weight:500}
.sched .hh{font-size:12.5px;color:var(--muted)}
.cell{height:38px;border-radius:8px;border:0;padding:0}
.cell.f{background:linear-gradient(180deg,rgba(var(--rgb),.8),rgba(var(--rgb),.44));box-shadow:0 0 14px rgba(var(--rgb),calc(.4*var(--glow)))}
.cell.f:hover{filter:brightness(1.2)}
.cell.x{background:var(--track);cursor:not-allowed}
.cell.s{background:var(--text);box-shadow:0 0 0 3px var(--c),0 0 24px rgba(var(--rgb),calc(.9*var(--glow)))}
.legend{display:flex;gap:20px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sum{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.sum small{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.sum .tot{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.banner{padding:14px 16px;border-radius:10px;border:1px solid var(--c);background:rgba(var(--rgb),.14);font-size:15px;line-height:1.5}

/* Ask: one question at a time */
.ask{min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.segs{display:flex;gap:6px;max-width:300px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--track)}
.segs span.on{background:var(--text);box-shadow:0 0 14px rgba(var(--rgb,74,125,255),calc(.8*var(--glow)))}
.ask form{display:flex;flex-direction:column;gap:30px;max-width:860px}
h1.q{font-family:var(--display);font-size:clamp(38px,6.4vw,76px);line-height:1.04;font-weight:700;letter-spacing:-.04em}
[dir="rtl"] h1.q{font-family:var(--font);letter-spacing:0;line-height:1.25}
.big{width:100%;max-width:680px;border:0;border-bottom:3px solid var(--text);background:transparent;padding:6px 0 10px;font-family:var(--display);font-size:clamp(28px,4.6vw,52px);font-weight:500;letter-spacing:-.03em;outline:none;border-radius:0}
[dir="rtl"] .big{font-family:var(--font)}
.big::placeholder{color:var(--muted);opacity:.7}
.big:focus{border-bottom-color:var(--c,#4A7DFF);box-shadow:0 10px 24px -14px rgba(var(--rgb,74,125,255),.9)}
.ask-nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hint{font-size:15px;color:var(--soft)}
.ask-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.success{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding-block:40px}
.ok{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#131418;background:linear-gradient(135deg,#4A7DFF,#22C3A6 70%,#7FE6D8)}
.demo-note{font-size:13.5px;color:var(--muted);margin:0}
.alt{margin:0;font-size:15px;color:var(--soft)}.alt a{font-weight:600}

/* Teach */
.teach-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:56px;align-items:center}
.calc{display:flex;flex-direction:column;gap:26px;padding:28px;border-radius:20px;border:1px solid var(--panel-b);background:var(--panel)}
.range{width:100%;height:30px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#4A7DFF var(--p,36%),var(--track) var(--p,36%))}
.range::-moz-range-track{height:8px;border-radius:4px;background:var(--track)}
.range::-moz-range-progress{height:8px;border-radius:4px;background:#4A7DFF}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:var(--text);border:0;box-shadow:0 0 0 6px rgba(74,125,255,.32)}
.range::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--text);border:0;box-shadow:0 0 0 6px rgba(74,125,255,.32)}
.calc-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.calc-row .v{font-family:var(--display);font-size:clamp(34px,4.4vw,54px);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.split{display:flex;height:56px;border-radius:12px;overflow:hidden;font-size:15px;font-weight:600}
.split .you{width:85%;background:#22C3A6;color:#131418;display:flex;align-items:center;padding-inline:18px}
.split .fee{width:15%;background:var(--track);display:flex;align-items:center;justify-content:center}
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.perk{display:flex;flex-direction:column;gap:12px;padding:24px 26px 24px 0;border-top:1px solid var(--line)}
[dir="rtl"] .perk{padding:24px 0 24px 26px}
.perk svg{color:var(--text)}
.perk h3{font-size:18px;font-weight:600}
.perk p{margin:0;font-size:15px;line-height:1.55;color:var(--soft)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s}
.steps li{counter-increment:s;border-top:3px solid var(--text);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.steps li::before{content:counter(s);font-family:var(--display);font-size:28px;font-weight:700}
.steps h3{font-size:18px;font-weight:600}
.steps p{margin:0;font-size:15px;line-height:1.55;color:var(--soft)}
.apply{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:start}
.wizard{display:flex;flex-direction:column;gap:26px}
.progress{display:flex;gap:6px}
.progress div{flex:1;border-top:4px solid var(--track);padding-top:8px;font-size:13px;color:var(--muted)}
.progress .done{border-color:var(--text);color:var(--soft)}
.progress .cur{border-color:#4A7DFF;color:var(--text);font-weight:600}
.form{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.subj{border:1px solid var(--panel-b);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.subj>label{display:flex;align-items:center;gap:12px;font-weight:600}
.subopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.subopts label{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--soft)}
.drops{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px;padding:16px;border:2px dashed var(--panel-b);border-radius:12px;text-align:center;font-size:14px;color:var(--soft);cursor:pointer;overflow:hidden}
.drop:hover,.drop:focus-within{border-color:var(--text)}
.drop b{color:var(--text);font-size:16px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop.has{border-style:solid;border-color:#22C3A6}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rate{border:1px solid var(--panel-b);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rate .top{display:flex;align-items:center;gap:10px;font-weight:600}
.money{display:flex;align-items:center;gap:8px}
.you-get{font-size:13.5px;color:var(--soft)}
.wiz-nav{display:flex;justify-content:space-between;gap:12px}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-list li{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-top:1px solid var(--line);font-size:16px}
.review-list li span:first-child{color:var(--muted)}
.preview{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.pcard{display:flex;flex-direction:column;gap:20px;padding:26px;border-radius:20px;border:1px solid var(--panel-b);background:var(--panel)}
.pcard .who{display:flex;align-items:center;gap:20px}
.pcard .nm{font-family:var(--display);font-size:24px;font-weight:500;letter-spacing:-.03em;overflow-wrap:anywhere}
[dir="rtl"] .pcard .nm{font-family:var(--font);font-weight:600}
.pcard .hl{font-size:15px;color:var(--soft);margin-top:6px;line-height:1.45}
.pcard .tags{font-size:15px;color:var(--text);line-height:1.6}
.pcard .pr{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--soft)}
.pcard .pr b{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)}
.status i{width:10px;height:10px;border-radius:50%;background:#F5B544;display:inline-block}


/* account menu + profile */
header.rise{position:relative;z-index:30}
.acct{position:relative;margin-inline-start:6px}
.av{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--btn);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;overflow:hidden}
.av.md{width:46px;height:46px;border-radius:12px;font-size:19px}
.av.lg{width:96px;height:96px;border-radius:22px;font-size:38px}
.acct-btn{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 10px 4px 4px;border-radius:12px;background:transparent;border:1px solid var(--panel-b);color:var(--text);font-weight:500;font-size:15px}
.acct-btn:hover{border-color:var(--text)}
.acct-btn .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn .chev{display:flex;color:var(--muted);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.acct.open .acct-btn .chev{transform:rotate(180deg)}
.acct-menu{position:absolute;z-index:50;inset-inline-end:0;top:calc(100% + 10px);width:280px;padding:8px;border-radius:16px;border:1px solid var(--panel-b);background:var(--bg);box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
  transform-origin:top right;transform:translateY(-10px) scale(.94);opacity:0;visibility:hidden;transition:opacity .2s ease,transform .32s cubic-bezier(.2,.9,.25,1.15),visibility 0s linear .32s}
[dir="rtl"] .acct-menu{transform-origin:top left}
.acct.open .acct-menu{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.acct-menu>*{opacity:0;transform:translateY(-6px);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.9,.3,1)}
.acct.open .acct-menu>*{opacity:1;transform:none}
.acct.open .acct-menu>:nth-child(1){transition-delay:.05s}.acct.open .acct-menu>:nth-child(2){transition-delay:.09s}.acct.open .acct-menu>:nth-child(3){transition-delay:.13s}.acct.open .acct-menu>:nth-child(4){transition-delay:.17s}
.acct-who{display:flex;align-items:center;gap:12px;padding:12px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.acct-who b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-who>div span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-who>div{min-width:0}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:10px;background:none;border:0;color:var(--text);text-decoration:none;font-size:15.5px;text-align:start}
.mi:hover,.mi:focus-visible{background:var(--hi)}
.mi svg{flex:none;color:var(--muted)}
.pf{display:flex;flex-direction:column;gap:36px;max-width:980px;width:100%}
.pf-head{display:flex;align-items:center;gap:24px}
.pf-head h1{margin:0;font-family:var(--display);font-size:clamp(24px,3.2vw,36px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.pf-head p{margin:6px 0 0;color:var(--soft);font-size:15.5px;overflow-wrap:anywhere}
.pf-head p.m{color:var(--muted);font-size:14px;margin-top:4px}
.pf-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:56px;align-items:start}
.pf-nav{display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
.pf-nav button{text-align:start;padding:13px 18px;margin-inline-start:-1px;border:0;border-inline-start:2px solid transparent;background:none;color:var(--soft);font-size:15.5px}
.pf-nav button:hover{color:var(--text)}
.pf-nav button[aria-current="true"]{color:var(--text);font-weight:600;border-inline-start-color:var(--btn)}
.pf-panel{display:flex;flex-direction:column;gap:22px;max-width:640px;min-width:0}
.pf-panel h2{margin:0;font-size:21px;font-weight:600}
.pf-panel form{display:flex;flex-direction:column;gap:20px}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pf-photo{display:flex;align-items:center;gap:22px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.pf-photo .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pf-photo .btn{min-height:42px;padding:0 16px;font-size:15px}
.pf-photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pf-msg{padding:12px 14px;border-radius:10px;border:1px solid rgba(var(--qu-rgb),.55);background:rgba(var(--qu-rgb),.12);font-size:15px;line-height:1.5}
.pf-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
textarea.input{font-family:inherit}
@media (max-width:860px){
  .pf-body{grid-template-columns:1fr;gap:26px}
  .pf-nav{flex-direction:row;border-inline-start:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .pf-nav button{white-space:nowrap;margin:0 0 -1px;border-inline-start:0;border-bottom:2px solid transparent;padding:12px 14px}
  .pf-nav button[aria-current="true"]{border-bottom-color:var(--btn)}
}
@media (max-width:640px){
  .acct-btn .nm{display:none}.acct-btn{padding-inline-end:8px}
  .pf-head{gap:16px}.av.lg{width:76px;height:76px;font-size:30px}
  .pf-row{grid-template-columns:1fr}
  .acct-menu{width:min(280px,calc(100vw - 36px))}
}
@media (prefers-reduced-motion:reduce){.acct-menu,.acct-menu>*,.acct-btn .chev{transition:none!important}}
@media (max-width:1100px){
  .results{grid-template-columns:1fr;gap:28px}
  .side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .side h2{grid-column:1/-1}
  .prof,.apply,.teach-top{grid-template-columns:1fr}
  .book,.preview{position:static}
  .grid{grid-template-columns:1fr}
  .perks,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:80px minmax(0,1fr) 140px}
  .trow .bars-col{display:none}
  .trow .open{display:none}
}
@media (max-width:640px){
  .container{padding-inline:18px}
  .nav-links .hide-sm{display:none}
  .art{height:150px}
  .search{flex-wrap:wrap;padding:10px}.search input{flex-basis:calc(100% - 40px)}.search button{width:100%}
  .side{grid-template-columns:1fr}
  .trow{grid-template-columns:64px minmax(0,1fr);gap:14px}
  .trow .price-col{grid-column:2}
  .perks,.steps{grid-template-columns:1fr}
  .sched{gap:4px;grid-template-columns:38px repeat(7,minmax(0,1fr))}
  .book{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  .intro,.flood{display:none}
  .rise,.enter>*,.blob,.mesh,.dot,.orb i,.tess,.curve{animation:none}
  .wr .ink{animation:none;clip-path:none}.wr .nib{display:none}.rose .ro1,.rose .ro2{transition:none}
  .brand .hl,.brand .hr,.brand .hm,.brand .hd{animation:none!important}.lg-words{transition:none}
  .curve{stroke-dashoffset:0}
  .panel,.trow,.orb{transition:none}
}


/* ---- Polish pass (no motion changes) ---- */
:root{--sp1:8px;--sp2:16px;--sp3:24px;--sp4:40px;--sp5:64px;--r:12px}
body{line-height:1.55;text-rendering:optimizeLegibility}
p,.desc,.lead,.sub{max-width:68ch}
.panel,.calc{border-radius:var(--r)}
.btn{border-radius:10px;letter-spacing:0;transition:background .15s,border-color .15s,filter .15s}
.btn-ghost{border-color:var(--line)}
.input,.field select,textarea.input{border-radius:10px;border-color:var(--line);transition:border-color .15s,box-shadow .15s,background .15s}
.input:hover{border-color:var(--panel-b)}
.input:focus,.input:focus-visible{outline:0;border-color:var(--c,#4A7DFF);box-shadow:0 0 0 3px rgba(var(--rgb,74,125,255),.22)}
.field>label,.lbl{font-size:14px;font-weight:500;color:var(--soft)}
.calc{padding:clamp(20px,4vw,32px);gap:24px}
.calc-row{flex-wrap:wrap;row-gap:4px}
.calc-row .v{font-family:var(--font);font-weight:600;font-size:clamp(28px,7.4vw,44px);letter-spacing:-.02em;white-space:nowrap}
#monV,#wkV{font-family:var(--font)!important;font-weight:600!important}
#monV{font-size:clamp(20px,5vw,28px)!important;letter-spacing:-.01em;line-height:1.25}
.split{height:auto;min-height:52px;border-radius:10px;font-size:14px}
.split .you{flex:1;width:auto;min-width:0;padding-block:14px}
.split .fee{flex:none;width:auto;padding-inline:14px;white-space:nowrap;font-size:13px}
.teach-top .btn,.hero .btn{text-align:center}
.panel h2,.side h2{font-weight:600}
.trust{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;margin:28px auto 8px;padding:16px 0;border-block:1px solid var(--line);color:var(--soft);font-size:14px}
.trust span{display:inline-flex;align-items:center;gap:10px}
.trust svg{width:20px;height:20px;flex:none;stroke:#22C3A6;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
html[data-theme="light"] .trust svg{stroke:#087562}
.trow{padding-block:22px}
.foot{margin-top:var(--sp4)}
a{text-underline-offset:3px}
@media (max-width:640px){
  .teach-top .btn,.teach-top .btn-lg{width:100%;min-height:54px}
  .calc-row .v{font-size:clamp(26px,9vw,36px)}
  .trust{justify-content:flex-start;gap:10px 24px}
}
[dir="rtl"] .range::-webkit-slider-runnable-track{background:linear-gradient(270deg,#4A7DFF var(--p,36%),var(--track) var(--p,36%))}
@media (max-width:640px){
  nav.top{flex-wrap:nowrap;gap:6px;padding-block:14px}
  .nav-links{flex-wrap:nowrap;gap:0;font-size:14px;min-width:0}
  .nav-link{padding:8px 7px;font-size:14px;white-space:nowrap}
  .nav-links .btn{min-height:38px;padding:0 13px;font-size:14px}
  .nav-links .icon-btn{width:36px;height:36px}
  .nav-links .cur-pick{padding-inline:6px;gap:4px}
}
@media (max-width:360px){#acct .nav-link{display:none}}
.nav-links .btn{white-space:nowrap}
@media (max-width:420px){.nav-links .btn{padding:0 10px;font-size:13px}.nav-link{padding:8px 5px;font-size:13px}.nav-links .icon-btn{width:32px;height:32px}}
.legal h1,.contact h1,.about h1{margin-bottom:14px}
.legal h2,.contact h2{margin-top:36px;font-weight:600}
.legal h3,.contact h3,.contact dt{font-weight:600;margin-top:22px}

/* ---- Phone sizing pass ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:clip}
body{min-height:100vh;min-height:100dvh}
a,button,.btn,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:root{--ic:20px}
.container{padding-inline:max(18px,env(safe-area-inset-left),env(safe-area-inset-right))}
footer .foot{padding-bottom:max(20px,env(safe-area-inset-bottom))}
.nav-links svg,.search svg,.cur-pick svg,.icon-btn svg{width:var(--ic);height:var(--ic);flex:none}
.dd-btn svg,.back svg{width:16px;height:16px;flex:none}
.perk svg{width:24px;height:24px}
.foot a{display:inline-flex;align-items:center;min-height:44px;padding-inline:6px}
.nav-link,.cur-pick,.icon-btn{min-height:44px}
.icon-btn{min-width:44px;display:inline-flex;align-items:center;justify-content:center}
.back{min-height:44px;display:inline-flex;align-items:center}
@media (max-width:640px){
  .nav-links .icon-btn{width:40px;height:40px;min-height:40px;min-width:40px}
  .nav-links{align-items:center}
  nav.top .brand svg,.brand .lg-icon{width:40px;height:40px}
  .nav-links .btn{min-height:40px}
  .foot{flex-direction:column;align-items:flex-start;gap:4px}
  .foot>div{display:flex;flex-wrap:wrap;gap:0 6px}
  input[type=checkbox],.cb{width:22px;height:22px}
  .field label:has(input[type=checkbox]),label.chk{min-height:44px;display:flex;align-items:center;gap:12px}
  .perks{grid-template-columns:1fr}
  .range{height:44px}
}
.nav-link{display:inline-flex;align-items:center}

/* Wordmark intro must never push the header wider on phones */
@media (max-width:640px){
  .lg-words{max-width:70px;gap:1px}
  .w-en{font-size:16px}.w-ar{font-size:16px;line-height:1.3;margin-top:0}
  .brand.min:hover .lg-words,.brand.min:focus-visible .lg-words{max-width:70px}
  .nav-links #langBtn,.nav-links #acct .nav-link{max-width:90px;overflow:hidden;white-space:nowrap;transition:max-width .85s cubic-bezier(.65,0,.25,1),opacity .5s ease,padding .85s cubic-bezier(.65,0,.25,1)}
  nav.top:has(.brand:not(.min)) .nav-links #langBtn,
  nav.top:has(.brand:not(.min)) .nav-links #acct .nav-link,
  nav.top:has(.brand.min:hover) .nav-links #langBtn,
  nav.top:has(.brand.min:hover) .nav-links #acct .nav-link{max-width:0;opacity:0;padding-inline:0}
  nav.top{overflow:hidden}
}

.nav-links .sh{display:none}
@media (max-width:640px){
  .nav-links .lg{display:none}.nav-links .sh{display:inline}
  html[dir="rtl"] nav.top{flex-direction:row}
  html[dir="rtl"] .nav-links{flex-direction:row;justify-content:flex-start}
}

/* Arabic and spacing rhythm */
[dir="rtl"] body{line-height:1.75}
[dir="rtl"] .disp,[dir="rtl"] .d,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .v{letter-spacing:0}
[dir="rtl"] .btn,[dir="rtl"] .input,[dir="rtl"] .search button{line-height:1.4}
[dir="rtl"] .lead,[dir="rtl"] .sub,[dir="rtl"] .desc{text-wrap:pretty}
@media (max-width:640px){
  main{gap:22px;padding-block:12px 40px}
  .search-msg{min-height:0}
  .search-wrap{gap:6px}
  .trust{margin:6px auto 4px}
  .hero{gap:10px}
  .teach-top{gap:28px}
  .legal h2,.contact h2{margin-top:28px}
  .legal h3,.contact h3,.contact dt{margin-top:18px}
}

/* Installed (home-screen) app: keep the header clear of the status bar and notch */
.wrap{padding-top:env(safe-area-inset-top)}
.flood,.intro{padding-top:env(safe-area-inset-top)}
@media (display-mode:standalone){
  html{background:#131418}
  html[data-theme="light"]{background:#F6F4EE}
}

/* ======== Poster system: flat blocks, one cropped letter per subject, action bars ======== */
html[data-theme="dark"]{--bg:#101114;--panel:#101114;--btn:#22C3A6;--on:#0B1014;
  --ar:#5C86F2;--ar-rgb:92,134,242;--ar-btn:#2447C7;--ar-on:#FFFFFF;
  --qu:#2DB872;--qu-rgb:45,184,114;--qu-btn:#2DB872;--qu-on:#0B1014;
  --ma:#F6F4EE;--ma-rgb:246,244,238;--ma-btn:#F6F4EE;--ma-on:#101114;--glow:0}
html[data-theme="light"]{--bg:#F6F4EE;--panel:#F6F4EE;--btn:#22C3A6;--on:#0B1014;
  --ar:#2447C7;--ar-rgb:36,71,199;--ar-btn:#2447C7;--ar-on:#FFFFFF;
  --qu:#14804A;--qu-rgb:45,184,114;--qu-btn:#2DB872;--qu-on:#0B1014;
  --ma:#101114;--ma-rgb:16,17,20;--ma-btn:#101114;--ma-on:#F6F4EE;--glow:0}
html[data-theme="dark"][data-sj="ma"],html[data-theme="dark"][data-sj="qu"]{--bg:#101114}
.stage{display:none}
[data-k="ar"]{--pb:#2447C7;--pf:#FFFFFF;--pfr:255,255,255;--pm:#E3EAFF;--pbar:#22C3A6;--paf:#0B1014}
[data-k="qu"]{--pb:#2DB872;--pf:#0B1014;--pfr:11,16,20;--pm:#0F3F2A;--pbar:#2447C7;--paf:#FFFFFF}
html[data-theme="dark"] [data-k="ma"]{--pb:#F6F4EE;--pf:#101114;--pfr:16,17,20;--pm:#3B3E48;--pbar:#22C3A6;--paf:#0B1014}
html[data-theme="light"] [data-k="ma"]{--pb:#101114;--pf:#F6F4EE;--pfr:246,244,238;--pm:#B3B7C2;--pbar:#22C3A6;--paf:#0B1014}

/* hero: type-led, left aligned */
.hero{align-items:flex-start;text-align:start;gap:12px;padding-block:8px 4px}
h1.mega{font-size:clamp(34px,6.2vw,72px);line-height:1.02}
.hero .sub{max-width:52ch}
.search{border-radius:0;background:transparent;border:0;border-bottom:2px solid var(--text);padding-inline:2px 0;max-width:none}
.search:focus-within{border-color:var(--btn)}
.search button{border-radius:0;background:var(--btn);color:#0B1014;min-height:50px}
.search-wrap{align-items:stretch}

/* subject blocks */
.grid{gap:0;border-radius:6px;overflow:hidden}
.grid>div{display:flex;min-width:0}
.panel{flex:1;border:0;border-radius:0;gap:16px;padding:22px 22px 0;background:var(--pb);color:var(--pf);--c:var(--pf);--rgb:var(--pfr);box-shadow:none;position:relative;overflow:hidden}
.panel:hover,.panel.matched{box-shadow:none;border:0}
.panel.matched{outline:3px solid var(--text);outline-offset:-3px}
.panel h2{color:var(--pf)}
.panel .desc{color:var(--pm)}
.panel .online{color:var(--pm)}
.panel .online .dot{background:var(--pf);box-shadow:none}
.panel .art{height:170px;border-radius:0}
.panel .dd-btn{background:rgba(var(--pfr),.08);border:1px solid rgba(var(--pfr),.55);border-radius:4px;color:var(--pf)}
.panel .dd-btn:hover,.panel .dd-btn[aria-expanded="true"]{border-color:var(--pf);box-shadow:none}
.panel .dd-list{color:var(--text);--rgb:74,125,255}
.panel .pv a{border-top:1px solid rgba(var(--pfr),.3);color:var(--pf)}
.panel .pv .ta{color:var(--pm)}
.panel .pv{margin-bottom:4px}
.panel .cta{margin:4px -22px 0;border-radius:0;min-height:56px;justify-content:space-between;padding:0 22px;background:var(--pbar);color:var(--paf);font-size:15px}
.panel .cta::after{content:"→";font-weight:500}
[dir="rtl"] .panel .cta::after{content:"←"}
.panel .cta:hover{filter:brightness(1.06)}
.panel .orb{box-shadow:none}

/* orbs: flat */
.orb{box-shadow:none}
.trust li i{box-shadow:none!important}

/* buttons and fields: square, honest */
.btn{border-radius:4px}
.dd-btn,.input,.field select,textarea.input{border-radius:4px}
.dd-list{border-radius:6px}
.trow{border-radius:0}
.trust{border-block:1px solid var(--line)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.panel .art{height:150px}}

/* ======== Poster system, part 2: subject pages, Teach, forms ======== */
[data-k="all"]{--pb:#2447C7;--pf:#FFFFFF;--pfr:255,255,255;--pm:#E3EAFF;--pbar:#22C3A6;--paf:#0B1014}
.panel .dd label,.panel .dd .dd-lab,.panel .dd>span:first-child{color:var(--pm)}
.trust{justify-content:flex-start;margin-inline:0;width:100%}
.trust li{color:var(--soft)}

.res-title{background:var(--pb);color:var(--pf);padding:24px 24px 26px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border-radius:6px;margin-bottom:6px}
.res-title::after{position:absolute;right:-6px;bottom:-34px;font-size:170px;line-height:.8;color:rgba(var(--pfr),.17);pointer-events:none;font-family:var(--font)}
[data-k="ar"] .res-title::after{content:"علم"}
[data-k="qu"] .res-title::after{content:"ق"}

          + '<label class="check-row"><input type="checkbox" id="wAgree"' + (d.agree ? ' checked' : '') + '><span>' + agreeHtml() + '</span></label><span class="err" id="wAgree-e" hidden></span>';
      }
      html += '<div class="wiz-nav">' + (w.step > 0 ? '<button type="button" class="btn btn-ghost" data-act="wprev">' + esc(s.prev) + '</button>' : '<span></span>') + '<button type="submit" class="btn btn-primary">' + esc(w.step === 2 ? s.submit : s.next) + '</button></div></form>';
    }
    html += '</div><aside class="preview" aria-label="' + esc(s.previewH) + '"><span class="note" style="font-size:15px;color:var(--soft)">' + esc(s.previewH) + '</span>' + previewCard() + '<p class="note">' + esc(s.wPrivacy) + '</p></aside></section>';
    return html;
  }

  var LEGAL = {
    en: {
      updated: 'Version of 22 November 2026',
      terms: { title: 'Terms of use', intro: 'These Terms apply when you use Tadriis (tadriis.com and teacher.tadriis.com). By ticking the box when you sign up, or by using Tadriis, you agree to them. If you do not agree, please do not use Tadriis.', s: [
        ['1. Who we are', ['Tadriis is an online platform that helps students and parents find and arrange lessons with independent teachers of Arabic, Quran and Islamic studies, and Math.', 'Tadriis is a part of Professionals for Training & Consulting LLC, a limited liability company licensed by the Sharjah Media City Free Zone Authority (Shams), Sharjah, United Arab Emirates, licence no. 2219525.01. You can reach us at master@tadriis.com.']],
        ['2. What Tadriis is, and is not', ['Tadriis is a facilitator. We provide the technology that lists teachers, shows their lessons and connects students and parents with them.', 'Teachers are independent professionals. They are not our employees, agents or partners. They decide what they teach and how, and they set their own rates.', 'A lesson is an agreement between the student (or parent) and the teacher. Tadriis is not a school or licensed educational institution and does not issue accredited qualifications.', 'We review teacher applications before a teacher is listed. A review is not a guarantee of quality, results or suitability, and we cannot check everything a teacher tells us. Please use your own judgement. Parents stay responsible for supervising their children.']],

        ['10. Complaints, removal and suspension', ['Tell us about problems or concerns at master@tadriis.com. We will look into them and reply.', 'We may remove a lesson, suspend an account or ask for more information when needed for safety, to follow the law or to enforce these Terms. We will explain why when we can.']],

    ar: {
      updated: 'إصدار 22 نوفمبر 2026',
      terms: { title: 'شروط الاستخدام', intro: 'تسري هذه الشروط عند استخدامك تدريس (tadriis.com وteacher.tadriis.com). بوضع علامة في المربع عند التسجيل أو باستخدامك تدريس فإنك توافق عليها. وإن لم توافق فيُرجى عدم استخدام تدريس.', s: [
        ['1. من نحن', ['تدريس منصّة إلكترونية تساعد الطلاب وأولياء الأمور على إيجاد دروس وترتيبها مع معلّمين مستقلين في اللغة العربية والقرآن والعلوم الإسلامية والرياضيات.', 'تدريس جزء من المحترفون للتدريب والاستشارات ذ م م، وهي شركة ذات مسؤولية محدودة مرخّصة من هيئة مدينة الشارقة للإعلام - المنطقة الحرة (شمس) في الشارقة بدولة الإمارات العربية المتحدة، رخصة رقم 2219525.01. يمكنك مراسلتنا على master@tadriis.com.']],
        ['2. ما هي تدريس وما ليست كذلك', ['تدريس منصّة تيسير. نوفّر التقنية التي تعرض المعلّمين ودروسهم وتصل الطلاب وأولياء الأمور بهم.', 'المعلّمون مهنيون مستقلون، وليسوا موظفين لدينا ولا وكلاء ولا شركاء. هم من يقرّر ما يدرّسونه وكيف، ويحدّدون أسعارهم بأنفسهم.', 'الدرس اتفاق بين الطالب (أو وليّ أمره) والمعلّم. تدريس ليست مدرسة ولا مؤسسة تعليمية مرخّصة ولا تصدر مؤهلات معتمدة.', 'نراجع طلبات المعلّمين قبل إدراجهم. والمراجعة ليست ضماناً للجودة أو النتائج أو الملاءمة، ولا نستطيع التحقق من كل ما يذكره المعلّم. يُرجى استخدام تقديرك الخاص، ويبقى أولياء الأمور مسؤولين عن الإشراف على أبنائهم.']],
        ['3. الحسابات ومن يحق له الانضمام', ['قدّم معلومات صحيحة، وحافظ على كلمة مرورك، وأخبرنا إن ظننت أن أحداً يستخدم حسابك. أنت مسؤول عمّا يجري في حسابك.', 'يمكن للطلاب من أي عمر التعلّم على تدريس. وإن كان الطالب دون 18 عاماً فيجب أن يوافق وليّ أمره على هذه الشروط نيابةً عنه وأن يبقى متابعاً له. ويمكن لأولياء الأمور إنشاء حسابات للأبناء من عمر 3 إلى 17 عاماً.', 'يجب أن يكون المعلّم بعمر 18 عاماً على الأقل، ومؤهلاً قانونياً لتقديم خدمات التدريس، وحاصلاً على أي تصاريح أو تراخيص يشترطها القانون الإماراتي أو قانون بلد إقامته.', 'لكل شخص حساب واحد. ويحق لنا تعطيل الحسابات التي تخالف هذه الشروط أو القانون.']],
        ['4. المعلّمون', ['تؤكد أن هويتك ومؤهلاتك وخبرتك ووصف دروسك صحيحة، وأن لك الحق في استخدام أي صور أو مواد ترفعها.', 'أنت تعمل لحسابك. وتتحمل مسؤولية ضرائبك وتراخيصك وتأمينك وتصاريح العمل أو الإقامة، والتزامك بالقوانين المطبّقة عليك.', 'عامل كل طالب باحترام ومهنية. اجعل التواصل في أمور التعلّم، ولا تطلب من طفل معلومات شخصية لا حاجة لها، وأبلغنا فوراً عن أي مخاوف تتعلق بالسلامة.', 'تتقاضى تدريس عمولة خدمة قدرها 15% من سعر الدرس عن الدروس التي تُرتَّب عبر تدريس. وتُظهر الحاسبة في طلب الانضمام ما ستحصل عليه. وتوافق على عدم نقل دروس بدأ ترتيبها عبر تدريس إلى خارج المنصّة لتجنّب العمولة.']],
        ['5. الدروس والأسعار والاسترداد', ['عند حجز درس أو دفع ثمنه عبر تدريس، يُعرض السعر والعملة وأي رسوم وقواعد الإلغاء والاسترداد قبل التأكيد.', 'لا تحدّ هذه القواعد من حقوقك بموجب قانون حماية المستهلك في الإمارات.']],
        ['6. تسجيل الدروس', ['للحفاظ على سلامة الدروس ولحل الشكاوى، قد تُسجَّل الدروس التي تُعقد عبر تدريس. وبموافقتك على هذه الشروط فإنك توافق على ذلك كما هو موضح في سياسة الخصوصية.', 'لا تسجّل الدرس ولا تنسخه ولا تشاركه بنفسك دون إذن جميع المشاركين فيه.']],
        ['7. الاستخدام المقبول', ['استخدم تدريس بصورة قانونية ومحترمة، بما يتوافق مع القانون الإماراتي والنظام العام والآداب العامة والقيم الدينية والثقافية للدولة.', 'لا تنشر أي محتوى مخالف للقانون أو يحضّ على الكراهية أو يتضمن تشهيراً أو محتوى جنسياً أو تهديداً. ولا تضايق أحداً، ولا تنتحل شخصية غيرك، ولا ترسل رسائل مزعجة، ولا تسحب بيانات الموقع آلياً، ولا تحاول اختراق حمايته أو تجاوزها.']],
        ['8. المحتوى والملكية الفكرية', ['تبقى ملكية ما تنشره لك. وتمنح تدريس ترخيصاً محدوداً بعرضه على المنصّة لنتمكن من تشغيل الخدمة، مثل ملفك كمعلّم ودروسك وصورك.', 'تدريس واسمها وشعارها وبرمجياتها مملوكة لنا. لا تنسخ مواد تخص غيرك، بما فيها الكتب والتلاوات والمحتوى التعليمي.']],
        ['9. مسؤوليتنا', ['نقدّم تدريس كمنصّة. ولا نضمن جودة أي معلّم أو توفّره أو أي نتيجة تعليمية، وبالقدر الذي يسمح به القانون الإماراتي لا نتحمل مسؤولية ما يقوله المعلّمون أو الطلاب أو يفعلونه، ولا محتوى الدروس.', 'ونبقى مسؤولين عن واجباتنا كمشغّل منصّة بموجب القانون الإماراتي، ومنها قوانين التجارة الإلكترونية وحماية المستهلك. ويشمل ذلك معالجة الشكاوى وإزالة المحتوى أو الحسابات المخالفة للقانون أو لهذه الشروط.', 'لا يلغي شيء في هذه الشروط أو يحدّ من أي حق أو مسؤولية لا يجوز إلغاؤها أو الحد منها بموجب القانون الإماراتي، وأي بند يحاول ذلك لا يسري.']],
        ['10. الشكاوى والإزالة والإيقاف', ['أخبرنا بأي مشكلة أو مخاوف على master@tadriis.com. سننظر فيها ونرد عليك.', 'يجوز لنا إزالة درس أو إيقاف حساب أو طلب معلومات إضافية عند الحاجة للسلامة أو لالتزام القانون أو لتطبيق هذه الشروط، وسنوضح السبب متى أمكن.']],
        ['11. بياناتك', ['تشرح سياسة الخصوصية كيف نتعامل مع البيانات الشخصية، وهي جزء من هذه الشروط.']],
        ['12. تغيير هذه الشروط', ['قد نحدّث هذه الشروط، ويبيّن تاريخ الإصدار في الأعلى وقت ذلك. وإن كان التغيير مهماً لك فسنخبرك وقد نطلب موافقتك من جديد. واستمرارك في استخدام تدريس بعد التغيير يعني قبولك له.']],
        ['13. القانون الحاكم وحل النزاعات', ['تخضع هذه الشروط لقوانين إمارة الشارقة والقوانين الاتحادية لدولة الإمارات العربية المتحدة. يُرجى التواصل معنا أولاً لنحاول حل أي خلاف معاً.', 'تختص محاكم إمارة الشارقة بنظر النزاعات، دون المساس بأي حق للمستهلك في اللجوء إلى جهة أخرى يكفلها له القانون الإماراتي.']]
      ] },
      privacy: { title: 'سياسة الخصوصية', intro: 'توضح هذه السياسة البيانات الشخصية التي تجمعها تدريس ولماذا، وخياراتك بشأنها. نلتزم بالمرسوم بقانون اتحادي رقم 45 لسنة 2021 في شأن حماية البيانات الشخصية وغيره من القوانين الإماراتية المطبّقة.', s: [
        ['1. الجهة المسؤولة', ['تدريس، وهي جزء من المحترفون للتدريب والاستشارات ذ م م (رخصة رقم 2219525.01، مدينة الشارقة للإعلام - المنطقة الحرة، شمس، الشارقة، الإمارات العربية المتحدة)، هي من يحدّد كيف ولماذا تُستخدم بياناتك. للتواصل: master@tadriis.com.']],
        ['2. ما الذي نجمعه', ['بيانات الحساب: الاسم والبريد الإلكتروني وصيغة مشفّرة من كلمة المرور (لا نحفظها نصاً صريحاً)، والدولة، واختيارياً رقم الهاتف ونبذة قصيرة وصورة.', 'لأولياء الأمور: اسم الطفل وعمره. وللطلاب: العمر.', 'للمعلّمين: المواد والمؤهلات والنبذة والخبرة واللغات والأسعار والدروس والصور التي ترفعها وأي مستندات تختار تقديمها لدعم طلبك.', 'الرسائل التي ترسلها إلينا، مثل طلبات الدعم.', 'بيانات تقنية: عنوان IP وسجلات الدخول لأغراض الأمان ومنع إساءة الاستخدام.', 'تسجيلات الدروس التي تُعقد عبر تدريس حيثما استُخدم التسجيل.']],
        ['3. لماذا نستخدمها', ['لإنشاء حسابك وتشغيله وتقديم الخدمة.', 'لمراجعة المعلّمين والحفاظ على سلامة الدروس، بما في ذلك التسجيل وحل الشكاوى.', 'لإرسال رسائل الخدمة مثل رسالة الترحيب وروابط إعادة تعيين كلمة المرور.', 'لحماية المنصّة والوفاء بالتزاماتنا القانونية.', 'أساسنا هو موافقتك التي تمنحها بوضع علامة في المربع عند التسجيل ويمكنك سحبها في أي وقت، إضافة إلى ضرورة تشغيل الخدمة التي طلبتها والالتزام بالقانون.']],
        ['4. الأطفال', ['نجمع فقط ما يلزم لتعلّم الطفل على تدريس، وبموافقة أحد الوالدين أو الوصي فقط. ولا نستخدم بيانات الأطفال للإعلانات. ونلتزم بالقواعد الإماراتية للسلامة الرقمية للأطفال.']],
        ['5. مع من نشاركها', ['يطّلع المعلّمون على البيانات التي يقدّمها الطلاب وأولياء الأمور لترتيب الدروس. ولا تُظهر ملفات المعلّمين العامة عناوين البريد الإلكتروني.', 'نستعين بمزوّدين موثوقين لتشغيل تدريس: Cloudflare للاستضافة والحماية، وHostinger للبريد الإلكتروني. ولا يجوز لهم استخدام البيانات إلا لتقديم خدمتهم لنا.', 'نشارك البيانات مع الجهات الرسمية في الإمارات عندما يوجب القانون ذلك. ولا نبيع البيانات الشخصية أبداً.']],

        var url = null; if (/^image\//.test(file.type)) { try { url = URL.createObjectURL(file); } catch (x) {} }
        return { name: file.name, url: url };
      });
      if (files.length) { d.files[id] = files; render(true); }
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'suAns') { var fld = t.getAttribute('data-f'); if (fld && fld !== 'pw') state.su.d[fld] = t.value; }
    if (t.hasAttribute('data-w')) { state.wiz.data[t.getAttribute('data-w')] = t.value; updatePreview(); }
    if (t.hasAttribute('data-price')) {
      var len = t.getAttribute('data-price'), d = state.wiz.data; d.rates[len].p = t.value;
      var p = parseFloat(t.value), you = document.querySelector('[data-you="' + len + '"]');
      if (you) you.textContent = f(S().wYouGet, { p: isFinite(p) && p > 0 ? fmtC(+(p * 0.85).toFixed(2)) : '—' });
      updatePreview();
    }
    if (t.id === 'prR') { state.price = Number(t.value); updateCalc(); updatePreview(); }
    if (t.id === 'wkR') { state.perWeek = Number(t.value); updateCalc(); }
    if (t.getAttribute('aria-invalid') === 'true') setErr(t.id, '');
  });

  document.addEventListener('mousemove', function (e) {
    var p = e.target.closest && e.target.closest('.panel'); if (!p || p.getAttribute('data-col') !== 'ma') return;
    var sv = p.querySelector('.art-ma svg'); if (!sv) return; var r = sv.getBoundingClientRect(); if (!r.width) return;
    var vx = (e.clientX - r.left) / r.width * 360;
    artSt.tx = Math.max(0, Math.min(MATH.xmax, (vx - MATH.x0) / MATH.w * MATH.xmax)); artSt.hold = Date.now();
    if (reduceMotion) { artSt.X = artSt.tx; mathDraw(artSt.X); }
  });
  document.addEventListener('mouseover', function (e) {
    var p = e.target.closest && e.target.closest('.panel'); if (p && p.getAttribute('data-col') === 'ar' && !(e.relatedTarget && p.contains(e.relatedTarget))) replayWrite();
  });

  document.getElementById('ctryBtn').addEventListener('click', openCountry);
  document.getElementById('themeBtn').addEventListener('click', function () { state.theme = state.theme === 'dark' ? 'light' : 'dark'; store('theme', state.theme); renderChrome(); });
  document.getElementById('langBtn').addEventListener('click', function () { state.lang = state.lang === 'en' ? 'ar' : 'en'; store('lang', state.lang); document.body.classList.add('no-intro'); render(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var bx = document.getElementById('acctBox'); if (bx && bx.classList.contains('open')) { setMenu(false); var t = bx.querySelector('.acct-btn'); if (t) t.focus(); } } });
  window.addEventListener('hashchange', function () { state.pf.msg = ''; setMenu(false); var k = state.keep; state.keep = false; render(k); if (k) { var b = document.querySelector('.side .dd-btn'); } });

  /* ================= Start ================= */
  var st = load('theme'), sl = load('lang');
  if (st === 'light' || st === 'dark') state.theme = st;
  else { try { if (window.matchMedia('(prefers-color-scheme: light)').matches) state.theme = 'light'; } catch (e) {} }
  if (sl === 'ar' || sl === 'en') state.lang = sl;
  else if ((navigator.language || '').toLowerCase().indexOf('ar') === 0) state.lang = 'ar';
  var AR_D = '٠١٢٣٤٥٦٧٨٩';
  function digitsFor(t, ar) {
    if (t.indexOf('@') !== -1) return t;
    return ar ? t.replace(/[0-9]/g, function (d) { return AR_D[d]; }) : t.replace(/[٠-٩]/g, function (d) { return String(AR_D.indexOf(d)); });
  }
  var digitBusy = false;
  function localizeDigits() {
    if (digitBusy) return; digitBusy = true;
    try {
      var ar = state.lang === 'ar';
      var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: function (n) {
        var p = n.parentNode; if (!p || /^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT; } });
      var n, list = []; while ((n = w.nextNode())) list.push(n);
      list.forEach(function (t) { var v = digitsFor(t.nodeValue, ar); if (v !== t.nodeValue) t.nodeValue = v; });
    } finally { digitBusy = false; }
  }
  var digitTimer = 0;
  new MutationObserver(function () { if (digitBusy) return; cancelAnimationFrame(digitTimer); digitTimer = requestAnimationFrame(localizeDigits); })
    .observe(document.body, { childList: true, characterData: true, subtree: true });
  setCountry(guessCountry());
  render(true);
  loadTeachers(); restoreSession();
  var intro = document.getElementById('intro');
  setTimeout(function () { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); document.body.classList.add('no-intro'); }, 2300);
  setTimeout(function () { var br = document.getElementById('brand'); if (br) br.classList.add('min'); }, 4800);

})();
</script>
